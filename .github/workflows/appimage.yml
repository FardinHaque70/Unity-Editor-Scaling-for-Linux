name: AppImage build and acceptance
on:
  push:
    branches: [main, appimage-v0.4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Ephemeral build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ninja-build python3-dev python3-pip python3-gi python3-gi-cairo python3-cairo python3-mako python3-markdown python3-packaging bison flex gettext libffi-dev libpcre2-dev libgtk-3-dev libjson-c-dev libssl-dev libxml2-dev libepoxy-dev libgraphene-1.0-dev libxkbcommon-dev libxrandr-dev libxi-dev libxcursor-dev libxdamage-dev libxfixes-dev libxinerama-dev libxcomposite-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgdk-pixbuf2.0-bin librsvg2-common libgirepository1.0-dev gobject-introspection xsltproc docbook-xsl ca-certificates patchelf squashfs-tools zstd desktop-file-utils xvfb x11-utils
          python3 -m pip install --disable-pip-version-check meson==1.3.2
      - name: Python and native protocol tests
        run: python3 -m unittest discover -s tests -v
      - name: Build self-contained AppImage
        run: bash packaging/build_appimage.sh
      - name: Artifact smoke in clean user environment
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          mkdir -p "$RUNNER_TEMP/clean-home"
          HOME="$RUNNER_TEMP/clean-home" xvfb-run -a dist/Unity-Editor-Scaling-for-Linux-x86_64.AppImage --appimage-extract-and-run --self-test
          python3 packaging/audit_artifact.py dist/Unity-Editor-Scaling-for-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appimage-x86_64
          path: dist/Unity-Editor-Scaling-for-Linux-x86_64.AppImage
          retention-days: 3
  clean-runtime:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [ubuntu:22.04, ubuntu:24.04, fedora:43]
    container: ${{ matrix.container }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: appimage-x86_64
      - name: No host Python or GTK packages
        run: |
          chmod +x Unity-Editor-Scaling-for-Linux-x86_64.AppImage
          ./Unity-Editor-Scaling-for-Linux-x86_64.AppImage --appimage-extract-and-run --self-test
